<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>TG LOGISTICS - Escáner</title>


  <!-- =====================================================
       ZXING BROWSER
       Motor de lectura de códigos de barras
  ====================================================== -->

  <script src="https://unpkg.com/@zxing/library@0.23.0/umd/index.min.js"></script>

  <script src="https://unpkg.com/@zxing/browser@0.2.1/umd/zxing-browser.min.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 20px;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        #f4f6f8;

      color:
        #202124;

    }


    .contenedor {

      max-width:
        650px;

      margin:
        auto;

    }


    .tarjeta {

      background:
        white;

      padding:
        24px;

      border-radius:
        18px;

      box-shadow:
        0 3px 15px
        rgba(0,0,0,.12);

    }


    h1 {

      text-align:
        center;

      margin-top:
        0;

      margin-bottom:
        8px;

      font-size:
        32px;

    }


    .subtitulo {

      text-align:
        center;

      color:
        #5f6368;

      font-size:
        18px;

      margin-bottom:
        25px;

    }


    /* =====================================================
       VIDEO
    ====================================================== */

    #video {

      width:
        100%;

      height:
        auto;

      min-height:
        300px;

      max-height:
        65vh;

      object-fit:
        cover;

      background:
        #111;

      border-radius:
        14px;

      display:
        block;

    }


    .marco {

      position:
        relative;

      width:
        100%;

      overflow:
        hidden;

      border-radius:
        14px;

      background:
        #111;

    }


    .guia {

      position:
        absolute;

      left:
        8%;

      right:
        8%;

      top:
        42%;

      height:
        16%;

      border:
        3px solid
        rgba(255,255,255,.85);

      border-radius:
        10px;

      pointer-events:
        none;

    }


    /* =====================================================
       MENSAJES
    ====================================================== */

    .mensaje {

      margin-top:
        18px;

      padding:
        15px;

      border-radius:
        12px;

      text-align:
        center;

      line-height:
        1.5;

    }


    .info {

      background:
        #e8f0fe;

      color:
        #174ea6;

    }


    .exito {

      background:
        #e6f4ea;

      color:
        #137333;

      font-size:
        18px;

      font-weight:
        bold;

    }


    .error {

      background:
        #fce8e6;

      color:
        #c5221f;

    }


    #trackingDetectado {

      margin-top:
        10px;

      font-size:
        22px;

      word-break:
        break-all;

    }


    #tipoDetectado {

      margin-top:
        8px;

      font-size:
        14px;

      font-weight:
        normal;

      opacity:
        .8;

    }


    /* =====================================================
       BOTONES
    ====================================================== */

    button {

      width:
        100%;

      padding:
        15px;

      margin-top:
        15px;

      border:
        none;

      border-radius:
        10px;

      background:
        #1a73e8;

      color:
        white;

      font-size:
        17px;

      font-weight:
        bold;

      cursor:
        pointer;

    }


    button:hover {

      opacity:
        .9;

    }


    button:disabled {

      opacity:
        .55;

      cursor:
        not-allowed;

    }


    #botonReintentar {

      display:
        none;

    }


    .instrucciones {

      margin-top:
        18px;

      color:
        #5f6368;

      text-align:
        center;

      font-size:
        14px;

      line-height:
        1.5;

    }

  </style>

</head>


<body>


<div class="contenedor">


  <div class="tarjeta">


    <h1>
      📦 TG LOGISTICS
    </h1>


    <p class="subtitulo">
      Escáner de tracking
    </p>


    <div class="marco">

      <video
        id="video"
        autoplay
        muted
        playsinline
      ></video>

      <div class="guia"></div>

    </div>


    <div
      id="mensaje"
      class="mensaje info"
    >
      📷 Preparando cámara...
    </div>


    <div
      id="resultado"
      class="mensaje exito"
      style="display:none;"
    >

      ✅ Código leído correctamente


      <div
        id="trackingDetectado"
      ></div>


      <div
        id="tipoDetectado"
      ></div>

    </div>


    <button
      id="botonReintentar"
      onclick="iniciarEscaner()"
    >
      📷 Escanear nuevamente
    </button>


    <p class="instrucciones">

      Coloca el código dentro del recuadro.
      <br>

      Mantén el teléfono estable y evita reflejos
      sobre la etiqueta.

    </p>


  </div>


</div>



<script>

/* =====================================================
   VARIABLES
===================================================== */

let codeReader = null;

let controlesEscaner = null;

let escaneando = false;

let resultadoEnviado = false;


/* =====================================================
   ELEMENTOS
===================================================== */

const video =
  document.getElementById(
    "video"
  );

const mensaje =
  document.getElementById(
    "mensaje"
  );

const resultado =
  document.getElementById(
    "resultado"
  );

const trackingDetectado =
  document.getElementById(
    "trackingDetectado"
  );

const tipoDetectado =
  document.getElementById(
    "tipoDetectado"
  );

const botonReintentar =
  document.getElementById(
    "botonReintentar"
  );


/* =====================================================
   MENSAJE
===================================================== */

function mostrarMensaje(
  texto,
  tipo
) {

  mensaje.className =
    "mensaje " +
    tipo;

  mensaje.innerHTML =
    texto;

}


/* =====================================================
   FORMATO LEGIBLE
===================================================== */

function nombreFormato(
  formato
) {

  if (!formato) {
    return "";
  }


  const nombres = {

    "AZTEC":
      "Aztec",

    "CODABAR":
      "Codabar",

    "CODE_39":
      "Code 39",

    "CODE_93":
      "Code 93",

    "CODE_128":
      "Code 128",

    "DATA_MATRIX":
      "Data Matrix",

    "EAN_8":
      "EAN-8",

    "EAN_13":
      "EAN-13",

    "ITF":
      "ITF",

    "MAXICODE":
      "MaxiCode",

    "PDF_417":
      "PDF417",

    "QR_CODE":
      "QR",

    "RSS_14":
      "RSS-14",

    "RSS_EXPANDED":
      "RSS Expanded",

    "UPC_A":
      "UPC-A",

    "UPC_E":
      "UPC-E",

    "UPC_EAN_EXTENSION":
      "UPC/EAN Extension"

  };


  return
    nombres[formato]
    || formato;

}


/* =====================================================
   INICIAR ESCÁNER
===================================================== */

async function iniciarEscaner() {


  if (escaneando) {
    return;
  }


  resultadoEnviado =
    false;


  resultado.style.display =
    "none";


  botonReintentar.style.display =
    "none";


  mostrarMensaje(
    "📷 Solicitando acceso a la cámara...",
    "info"
  );


  try {


    /* =================================================
       VERIFICAR ZXING
    ================================================== */

    if (
      typeof ZXingBrowser ===
      "undefined"
    ) {

      throw new Error(
        "No se pudo cargar el motor ZXing."
      );

    }


    if (
      typeof ZXing ===
      "undefined"
    ) {

      throw new Error(
        "No se pudo cargar la biblioteca ZXing."
      );

    }


    /* =================================================
       HINTS
       FORMATO MULTI-CÓDIGO
    ================================================== */

    const hints =
      new Map();


    const formatos = [

      ZXing.BarcodeFormat.AZTEC,

      ZXing.BarcodeFormat.CODABAR,

      ZXing.BarcodeFormat.CODE_39,

      ZXing.BarcodeFormat.CODE_93,

      ZXing.BarcodeFormat.CODE_128,

      ZXing.BarcodeFormat.DATA_MATRIX,

      ZXing.BarcodeFormat.EAN_8,

      ZXing.BarcodeFormat.EAN_13,

      ZXing.BarcodeFormat.ITF,

      ZXing.BarcodeFormat.MAXICODE,

      ZXing.BarcodeFormat.PDF_417,

      ZXing.BarcodeFormat.QR_CODE,

      ZXing.BarcodeFormat.RSS_14,

      ZXing.BarcodeFormat.RSS_EXPANDED,

      ZXing.BarcodeFormat.UPC_A,

      ZXing.BarcodeFormat.UPC_E

    ];


    hints.set(

      ZXing.DecodeHintType.POSSIBLE_FORMATS,

      formatos

    );


    /* =================================================
       TRY HARDER
       MUY IMPORTANTE PARA UPS / USPS
    ================================================== */

    hints.set(

      ZXing.DecodeHintType.TRY_HARDER,

      true

    );


    /* =================================================
       CREAR LECTOR
    ================================================== */

    codeReader =
      new ZXingBrowser.BrowserMultiFormatReader(
        hints,
        {
          delayBetweenScanAttempts: 150
        }
      );


    /* =================================================
       CÁMARA TRASERA
    ================================================== */

    const constraints = {

      video: {

        facingMode: {
          ideal:
            "environment"
        },

        width: {
          ideal:
            1920
        },

        height: {
          ideal:
            1080
        }

      }

    };


    /* =================================================
       INICIAR VIDEO
    ================================================== */

    controlesEscaner =
      await codeReader.decodeFromConstraints(

        constraints,

        video,

        function(
          resultadoLectura,
          error
        ) {


          if (
            !resultadoLectura
          ) {

            return;

          }


          codigoDetectado(
            resultadoLectura
          );

        }

      );


    escaneando =
      true;


    mostrarMensaje(

      "📷 Apunta la cámara al código de barras o código 2D.",

      "info"

    );


  }

  catch (error) {


    escaneando =
      false;


    console.error(
      "Error ZXing:",
      error
    );


    mostrarMensaje(

      "❌ No se pudo iniciar la cámara." +

      "<br><br>" +

      "Verifica que hayas permitido el acceso a la cámara." +

      "<br><br>" +

      (
        error &&
        error.message
          ? error.message
          : String(error)
      ),

      "error"

    );


    botonReintentar.style.display =
      "block";

  }

}


/* =====================================================
   CÓDIGO DETECTADO
===================================================== */

function codigoDetectado(
  resultadoLectura
) {


  if (
    resultadoEnviado
  ) {

    return;

  }


  if (
    !resultadoLectura
  ) {

    return;

  }


  const tracking =
    String(
      resultadoLectura.getText()
      || ""
    )
    .trim();


  if (!tracking) {

    return;

  }


  /* =================================================
     EVITAR RESULTADOS EXTRAÑOS
  ================================================== */

  if (
    tracking.length < 3
  ) {

    return;

  }


  resultadoEnviado =
    true;


  const formato =
    resultadoLectura
      .getBarcodeFormat();


  const formatoNombre =
    nombreFormato(
      formato
    );


  /* =================================================
     DETENER CÁMARA
  ================================================== */

  detenerEscaner();


  /* =================================================
     MOSTRAR RESULTADO
  ================================================== */

  trackingDetectado
    .textContent =
      tracking;


  tipoDetectado
    .textContent =
      formatoNombre
        ? "Formato: " +
          formatoNombre
        : "";


  resultado.style.display =
    "block";


  mostrarMensaje(

    "✅ Código leído correctamente.",

    "exito"

  );


  /* =================================================
     DEVOLVER AL PANEL ADMINISTRATIVO
  ================================================== */

  if (
    window.opener &&
    !window.opener.closed
  ) {

    window.opener.postMessage(

      {

        tipo:
          "TRACKING_ESCANEADO",

        tracking:
          tracking

      },

      "*"

    );

  }


}


/* =====================================================
   DETENER ESCÁNER
===================================================== */

function detenerEscaner() {


  if (
    codeReader
  ) {

    try {

      codeReader.reset();

    }

    catch(error) {

      console.error(
        "Error al detener ZXing:",
        error
      );

    }

  }


  if (
    controlesEscaner
  ) {

    try {

      if (
        typeof controlesEscaner.stop ===
        "function"
      ) {

        controlesEscaner.stop();

      }

    }

    catch(error) {

      console.error(
        "Error al detener controles:",
        error
      );

    }

  }


  if (
    video.srcObject
  ) {

    const tracks =
      video.srcObject
        .getTracks();


    tracks.forEach(
      function(track) {

        track.stop();

      }
    );


    video.srcObject =
      null;

  }


  escaneando =
    false;

}


/* =====================================================
   LIMPIAR AL CERRAR / SALIR
===================================================== */

window.addEventListener(
  "beforeunload",
  function() {

    detenerEscaner();

  }
);


/* =====================================================
   INICIAR AUTOMÁTICAMENTE
===================================================== */

window.addEventListener(
  "load",
  function() {

    iniciarEscaner();

  }
);

</script>


</body>

</html>
